name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate canonical runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin
        run: ./scripts/validate.sh

      - name: Run runtime smoke eval
        run: evals/run.sh 00-smoke
