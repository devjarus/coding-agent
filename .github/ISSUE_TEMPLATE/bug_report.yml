name: Bug Report
description: Report a bug or unexpected agent behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below so we can reproduce it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior
    validations:
      required: true

  - type: textarea
    id: prompt
    attributes:
      label: The prompt you gave
      description: The exact user message that triggered this behavior
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What did you think would happen?
    validations:
      required: true

  - type: textarea
    id: ledger-log
    attributes:
      label: Ledger log
      description: Relevant lines from `.coding-agent/<feature>/ledger.md`
      render: text

  - type: textarea
    id: artifacts
    attributes:
      label: Relevant artifacts
      description: Relevant intent/plan/review content and evidence entries, with secrets removed
      render: markdown

  - type: dropdown
    id: affected-agent
    attributes:
      label: Which agent misbehaved?
      options:
        - conductor
        - planner
        - developer (build/prove/review)
        - diagnostician
        - designer
        - deployer
        - not sure

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From .claude-plugin/plugin.json
      placeholder: "6.0.0"

  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Run `claude --version`
